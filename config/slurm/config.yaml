jobs: 100
cluster: "sbatch --partition={resources.partition} --time={resources.time} --mem={resources.mem_mb} --cpus-per-task={threads} --output=logs/slurm/%x_%j.out --error=logs/slurm/%x_%j.err"
default-resources:
  partition: "defq"
  time: "01:00:00"
  mem_mb: 4000
restart-times: 3
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 60
