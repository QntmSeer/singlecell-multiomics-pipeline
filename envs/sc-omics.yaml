name: sc-omics
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  - pip:
    - numpy<2
    - scanpy==1.9.3
    - anndata=0.9.2
    - mudata=0.2.3
    - muon
    - leidenalg
    - pandas
    - matplotlib
    - seaborn
    - scikit-learn
    - networkx
    - h5py
    - snakemake
