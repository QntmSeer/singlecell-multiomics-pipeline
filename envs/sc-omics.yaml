name: sc-omics
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - numpy>=1.22,<2.0
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - networkx
  - h5py
  - scanpy>=1.9.3
  - anndata>=0.9.0
  - mudata>=0.2.3
  - muon
  - leidenalg
  - snakemake
  - multiqc
  - scvi-tools
  - cellrank
  - pytorch
  - jax
  - jaxlib
  - scvelo
  - pip
  - pip:
    - multivelo
    - pycistopic
    - pycistarget
    - scenicplus

